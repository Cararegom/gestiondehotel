name: CI

on:
  push:
    branches: ['main', 'master']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Syntax check
        run: npm run check:syntax

      - name: Type check bank email functions
        run: npm run typecheck

      - name: Lint bank email functions
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build production assets
        run: npm run build
