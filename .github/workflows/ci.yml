name: CI

on:
  push:
    branches: ['main', 'master']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      # Bloquea solo vulnerabilidades altas en dependencias de produccion.
      # Las de herramientas de build (tailwindcss3 -> braces, sin version
      # corregida) se reportan en el paso siguiente sin bloquear el CI.
      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Full dependency audit (informativo)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Syntax check
        run: npm run check:syntax

      - name: Type check bank email functions
        run: npm run typecheck

      - name: Lint bank email functions
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build production assets
        run: npm run build
