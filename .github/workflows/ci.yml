name: CI

on:
  push:
    branches: ['main', 'master']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Production Edge env preflight
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN_NOT_AVAILABLE"
            exit 0
          fi
          npx --yes supabase@latest secrets --help >/dev/null
          npx --yes supabase@latest secrets list --project-ref iikpqpdoslyduecibaij > /tmp/supabase-secret-names.txt
          if grep -q 'BANK_EMAIL_PILOT_HOTEL_ID' /tmp/supabase-secret-names.txt; then
            echo "BANK_EMAIL_PILOT_HOTEL_ID_PRESENT"
          else
            echo "BANK_EMAIL_PILOT_HOTEL_ID_MISSING"
          fi
          rm -f /tmp/supabase-secret-names.txt

      - name: Install dependencies
        run: npm install

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Syntax check
        run: npm run check:syntax

      - name: Type check bank email functions
        run: npm run typecheck

      - name: Lint bank email functions
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build production assets
        run: npm run build
