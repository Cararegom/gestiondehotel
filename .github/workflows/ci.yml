name: CI

on:
  push:
    branches: ['main', 'master']
  pull_request:

permissions:
  contents: write
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Fix dependency audit in lockfile
        run: npm audit fix --package-lock-only

      - name: Reinstall fixed dependencies
        run: npm install

      - name: Require clean dependency audit
        run: npm audit --audit-level=high

      - name: Syntax check
        run: npm run check:syntax

      - name: Type check bank email functions
        run: npm run typecheck

      - name: Lint bank email functions
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build production assets
        run: npm run build

      - name: Commit audited lockfile to PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already clean"
            exit 0
          fi
          git commit -m "chore(deps): apply npm audit lockfile fixes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
