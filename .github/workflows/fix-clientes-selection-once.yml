name: Fix clientes selection once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-clientes-selection-once.yml'

permissions:
  contents: write

jobs:
  patch-clientes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted fix
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('js/modules/clientes/clientes.js')
          source = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              source = source.replace(old, new, 1)

          old = "        let { data, error } = await supabaseInstance.from('clientes').select('*').eq('id', clienteId).single();"
          new = "        let { data, error } = await supabaseInstance\n            .from('clientes')\n            .select('*')\n            .eq('id', clienteId)\n            .eq('hotel_id', hotelIdActual)\n            .maybeSingle();"
          replace_once(old, new, 'scope getClienteById by hotel')

          old = "    if (!supabaseInstance || !hotelIdActual || !clientesData.length) return;\n\n    try {\n        const results = await Promise.all(["
          new = "    if (!supabaseInstance || !hotelIdActual || !clientesData.length) return;\n\n    try {\n        let totalClientesHotel = clientesData.length;\n        const { count: totalClientesCount, error: totalClientesError } = await supabaseInstance\n            .from('clientes')\n            .select('id', { count: 'exact', head: true })\n            .eq('hotel_id', hotelIdActual);\n\n        if (totalClientesError) {\n            logError('No se pudo obtener el total exacto de clientes del hotel:', totalClientesError);\n        } else if (Number.isFinite(totalClientesCount)) {\n            totalClientesHotel = totalClientesCount;\n        }\n\n        const results = await Promise.all(["
          replace_once(old, new, 'load exact client count')

          old = "        crmPortfolioSummary = summarizeCRMPortfolio(clientesData, crmInsightsByClientId);\n        crmCampaignSuggestions = buildCampaignSuggestions(clientesData, crmInsightsByClientId);"
          new = "        crmPortfolioSummary = summarizeCRMPortfolio(clientesData, crmInsightsByClientId);\n        crmPortfolioSummary.total = totalClientesHotel;\n        crmCampaignSuggestions = buildCampaignSuggestions(clientesData, crmInsightsByClientId);"
          replace_once(old, new, 'apply exact client count to header')

          old = "        const filteredClients = await getClientes({ hotelId: hotelIdActual, search: texto, dateRange: dateRange });\n        renderTablaClientes(filteredClients);"
          new = "        const filteredClients = await getClientes({ hotelId: hotelIdActual, search: texto, dateRange: dateRange });\n\n        // Los resultados filtrados pueden incluir clientes que no estaban en la carga inicial.\n        // Se guardan en la cache para que Ver y Editar resuelvan siempre el ID seleccionado.\n        const clientesById = new Map(clientesData.map((cliente) => [String(cliente.id), cliente]));\n        filteredClients.forEach((cliente) => clientesById.set(String(cliente.id), cliente));\n        clientesData = Array.from(clientesById.values());\n\n        renderTablaClientes(filteredClients);"
          replace_once(old, new, 'cache filtered clients')

          old = "    const cliente = clientesData.find(c => c.id === clienteId);\n    if (!cliente) {\n        showError(document.getElementById('clientes-feedback'), 'Cliente no encontrado.');\n        return;\n    }"
          new = "    let cliente = clientesData.find(c => String(c.id) === String(clienteId));\n    if (!cliente) {\n        cliente = await getClienteById(clienteId);\n        if (!cliente) {\n            showError(document.getElementById('clientes-feedback'), 'Cliente no encontrado.');\n            return;\n        }\n        clientesData = [...clientesData, cliente];\n    }"
          replace_once(old, new, 'fallback client lookup for details')

          path.write_text(source, encoding='utf-8')
          PY

      - name: Validate syntax and tests
        run: |
          node scripts/check-syntax.js
          npm test

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/fix-clientes-selection-once.yml
          git config user.name "gestiondehotel-fix-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/modules/clientes/clientes.js .github/workflows/fix-clientes-selection-once.yml
          git commit -m "Corregir apertura de clientes fuera del limite inicial"
          git push origin HEAD:main
